name: videogame-tracker

services:
  db:
    image: postgres:17
    container_name: videogame-tracker-db
    environment:
      POSTGRES_DB: videogame_tracker
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - videogame_tracker_pgdata:/var/lib/postgresql/data

volumes:
  videogame_tracker_pgdata: